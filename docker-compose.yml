# Single-VPS deployment (R-11): the app plus an nginx that terminates TLS and proxies `wss://`.
#
# `docker compose up -d` after copying `.env.example` to `.env` and setting COACH_AUTH_TOKEN /
# COACH_ALLOWED_ORIGINS. See docs/deploy.md for the runbook, including certificates.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides whatever .env says: these are container paths, and .env is written for a local
      # checkout where the same keys mean host paths.
      COACH_CHECKPOINT_DB: /app/state/session-checkpoints.sqlite
      COACH_LEDGER_DB: /app/state/skill-ledger.json
      COACH_EXPORTS_DIR: /app/state/exports
      COACH_STATIC_DIR: /app/web/dist
      # The token ledger, and the same override for the same reason as COACH_LOG_FILE below: .env's
      # copy of this key is a host path for a local checkout. Unlike the log, losing this one is not
      # cosmetic — it is the free-tier budget balance, and an unwritable path now REFUSES metered
      # calls instead of silently reporting a full budget all day (M0a / F1).
      COACH_USAGE_LEDGER: /app/state/usage-ledger.jsonl
      # Same reason, and load-bearing: /app is root-owned 755 and the app runs as uid 10001, so any
      # relative path inherited from .env would fail `mkdir` and degrade to stderr-only — losing the
      # `llm-call` trace across the restart it exists to survive. Only the state volume is writable.
      COACH_LOG_FILE: /app/state/logs/coach-api.log
    volumes:
      # Everything that must survive a restart or a redeploy. Losing this volume loses in-flight
      # Sessions (checkpoints), every report not yet downloaded (R-08), and cross-session Skill
      # priors (the ledger) — the interviews themselves, not just a cache.
      - coach-state:/app/state
    expose:
      - "8000"
    # No published port by default: the app is reachable only through nginx, so TLS cannot be
    # bypassed by hitting the backend directly. Add `ports: ["127.0.0.1:8000:8000"]` to debug.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      # The ACME http-01 webroot, shared with the host's certbot. conf.d/coach.conf already serves
      # /.well-known/acme-challenge/ from /var/www/certbot, but nothing was mounted there, so the
      # challenge 404'd and the only authenticator left was `--standalone` — which needs :80, and
      # this container holds :80 for the life of the deployment. Renewal therefore could not work.
      - ./deploy/certbot-webroot:/var/www/certbot:ro
    # Without this, `docker compose ps` reads "Up" for a container whose config never loaded, and the
    # first sign of trouble is a Candidate's browser failing to connect. `app` has had a healthcheck
    # since R-11; this is the other half of the stack.
    #
    # It probes :80 for the redirect, NOT :443, and that is deliberate rather than lazy: the image
    # carries neither curl nor openssl, and busybox wget follows the 301 into TLS and then fails
    # certificate verification — so any :443 probe would report unhealthy for the whole self-signed
    # bootstrap phase that docs/deploy.md §3 makes step one of getting a real certificate. A probe
    # that flaps during the documented happy path is worse than a narrower one.
    #
    # What this proves: nginx is listening and coach.conf's server block is loaded. What it does NOT
    # prove: that TLS serves, or that the upstream is reachable. Those are pre-flight checks, run
    # once at deploy time against the real hostname — see docs/pilot-runbook.md.
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1/api/health 2>&1 | grep -q '301 Moved Permanently'"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  coach-state:
