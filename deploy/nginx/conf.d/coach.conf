# TLS termination + WebSocket proxy for the coach app (R-11).
#
# `server_name _` matches any hostname so this file needs no editing for a first deploy; replace it
# with your real name once you have a certificate for it (see docs/deploy.md).

upstream coach_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # ACME challenges must survive the redirect or certbot's http-01 can never complete.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # An interview answer is a paragraph of prose, not an upload; the transcript export is the only
    # large response. Keep the request cap small enough that it is not a memory lever.
    client_max_body_size 1m;

    location / {
        proxy_pass http://coach_app;
        proxy_http_version 1.1;

        # The Session socket lives here. Without Upgrade/Connection the handshake is answered as a
        # plain request and the UI silently never connects.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Origin is forwarded verbatim on purpose: R-07 checks it before accepting the socket, and
        # rewriting it here would disable that check by making every handshake look same-origin.
        proxy_set_header Origin            $http_origin;

        # A Candidate can sit on a hard question for minutes. The default 60s read timeout would
        # drop the socket mid-answer and surface as "connection lost" with no cause.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Streamed events must reach the browser as they happen, not when a buffer fills.
        proxy_buffering off;
    }
}
