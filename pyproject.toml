[project]
name = "interview-coach"
version = "0.1.0"
description = "Adaptive Interview Coach — a multi-agent mock technical interviewer (learning project)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "langgraph>=1.2.2",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]

[project.scripts]
coach = "interview_coach.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run is offline/lightweight: provider-hitting tests and optional Chroma/BGE tests are
# deselected unless explicitly requested with `-m live` or `-m rag`.
addopts = "-m 'not live and not rag'"
markers = [
    "live: hits a real LLM provider; deselected by default — select explicitly with `-m live`",
    "rag: requires optional Chroma + sentence-transformers extras; deselected by default",
]

[tool.mypy]
python_version = "3.12"
files = ["src/interview_coach"]
# The plugin is what makes this usable at all: without it every `Settings()` call is 40+ "missing
# named argument" errors, because mypy cannot see that pydantic generates an __init__ with defaults.
plugins = ["pydantic.mypy"]
# Deliberately NOT --strict. The gate's job is to catch real type errors on a codebase that was not
# written under mypy; turning on disallow_untyped_defs today would bury those under hundreds of
# annotation chores and the gate would be switched off within a week. Tighten incrementally.
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information. Not our errors to fix, and `ignore_missing_
# imports` on a named list (rather than globally) keeps a genuinely mistyped import loud.
module = ["yaml", "chromadb.*", "sentence_transformers.*", "langgraph.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
