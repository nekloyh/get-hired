# Frozen concept-retrieval eval set (issue R-15 / GH #70).
#
# THIS FILE IS THE EVAL SET. Nothing that computes a retrieval score is allowed to write it.
# `scripts/retrieval_eval.py` only reads it, and `tests/test_retrieval_eval.py` pins its sha256 —
# so any edit, including an edit to these comments, turns CI red until the pin is updated in the
# same diff. That two-place edit is the "explicit PR note" the AC asks for.
#
# WHY IT IS FROZEN. The 2026-07-11 audit
# (docs/audits/concept-retrieval-review-2026-07-11.md) derived its eval live from
# `questions.yaml`: queries from `follow_up_seeds`, ground truth from `expected_concepts`. Two
# things went wrong with that.
#   1. The ratchet. The agent running the eval scored 43/50, judged four of its own misses to be
#      label defects, edited `expected_concepts` (+mlops_experiment_tracking, +mlops_data_validation,
#      +vietnamese_nlp_vncorenlp) and one note tag, and reported 47/50. One-way, upward, self-graded.
#      ADR 0009 addendum (b) names exactly this failure class for the judge bench; retrieval had no
#      equivalent guard.
#   2. Silent drift of the denominator. The audit measured 50 lookups. The same enumeration on the
#      bank at 184f5a2 yields 59 — the bank grew and the eval followed it with nobody noticing, so a
#      published retrieval score was not even comparable to itself across commits.
# Both are fixed the same way: every query below is a LITERAL string, not a template re-joined at
# run time, and every label is a literal list. The bank can now move without moving the eval.
#
# THE 2026-07-11 LABEL AMENDMENTS ARE CARRIED IN AS-IS. This file freezes the ratchet where it
# stopped; it does not re-litigate it. Re-judging those four labels inside the PR that builds the
# freeze would be one more self-graded edit.
#
# FIELDS (all required on every row; `skill` and `language` must be present even when null).
#   id        unique, stable.
#   source    "seed"  a follow-up need enumerated from the bank, frozen at 184f5a2.
#             "live"  a real `TurnTrace.concept_lookup_query` written by the model in a Session.
#   origin    where the row came from, precisely enough to re-check it by hand.
#   skill     the Skill filter to replay with. Production ALWAYS sets one.
#   language  the language filter to replay with, frozen — never recomputed at run time.
#   query     the literal lookup string.
#   expected  hand-labelled acceptable hits (note ids). An EMPTY list means "harvested, not yet
#             labelled": the row is reported but never scored, so a growing backlog can never push
#             hit@1 down and create pressure to label optimistically.
#
# LANGUAGE FILTER — the third audit defect. The old script called `lookup_concept(store, query,
# skill=skill)` with no language at all, a call production never makes: `_preferred_lookup_language`
# (interviewer.py) returns "vi" for any `vietnamese_nlp` lookup and for every lookup in a vn/mixed
# Session (ADR 0007). The `language` below is that function's answer for a default en-mode Session,
# computed once at generation time and frozen. Honest caveat: on the shelf as it stands today all
# six `vietnamese_nlp` notes are already `language: vi`, so the filter selects the same candidates
# as the Skill filter alone and the frozen value changes no current number. It stops being a no-op
# the moment an English note lands on that shelf — which is precisely when an unfiltered eval would
# start quietly measuring a call production cannot make.
#
# SEED QUERIES ARE STILL A TEMPLATE, and that half of the audit defect is NOT fixed here. A seed
# query is `"<follow_up_seed> — <question text>"`; production queries are written by the model.
# Only the `source: live` rows are production-shaped, and there are three of them. The template is
# kept verbatim so the frozen number stays comparable to the 43/50 → 47/50 → 46/50 history; the fix
# is to grow the live half toward the 150+ target (`scripts/retrieval_eval.py --harvest`).
#
# ADMITTING A NEW ROW — the reviewer's obligations, in order:
#   1. `data/exports/` is gitignored as Candidate transcript data. A live query promoted into this
#      file is a fragment of a real interview crossing that boundary. Read every admitted string and
#      redact anything that identifies a Candidate.
#   2. Label from the concept shelf, not from what the store returned. Grading a query with the
#      answer the ranker gave is the ratchet wearing a different hat.
#   3. Harvest is stdout-only by construction. Stubs land in
#      `data/bench/pending-retrieval-queries-<date>.yaml` (the ADR-0009 pending-cases convention)
#      and a human moves them here.
#
# THE THREE LIVE ROWS BELOW WERE LABELLED BY THE SAME AGENT THAT BUILT THIS FILE, and their labels
# agree with the hit the ranker recorded (each `origin` says so). They therefore cannot falsify the
# ranker that produced them. Read the headline number with that in mind — `scripts/retrieval_eval.py`
# reports seed and live hit@1 separately for this reason.
#
# EMBEDDER INDEPENDENCE. A row is (query, filters, expected note ids). Re-ingesting the shelf under
# a different embedder does not invalidate it. Renaming an id in `data/concepts.yaml` does — the
# script warns when a label names a note that is no longer on the shelf.
#
# Generated from the question bank at 184f5a2 (45 questions, 40 concept notes) by a throwaway
# script, on 2026-08-01.

