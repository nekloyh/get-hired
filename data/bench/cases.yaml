    question: How does dropout regularize a network, and when would you avoid it?
    answer: >-
      Dropout tắt ngẫu nhiên một phần neuron mỗi bước train, nên các neuron không thể co-adapt — mỗi
      sub-network phải tự học feature hữu ích, giống như ensemble của nhiều mạng con. Lúc inference thì
      giữ nguyên toàn bộ neuron và scale activation theo keep probability để expectation khớp. Em sẽ
      tránh dùng dropout mạnh trong conv layer vì spatial feature bị phá, và khi đã có batch norm thì
      phải cẩn thận vì variance shift giữa train và inference có thể làm hai kỹ thuật đánh nhau.
