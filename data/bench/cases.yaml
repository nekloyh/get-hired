# Bilingual Judge calibration bench (issue 0022, ADR 0009).
#
# Each case is one Evaluator input with a HUMAN label. Cases come in EN/VN pairs (same question and
# same answer *content*, answer written in English vs Vietnamese) sharing a `paired_id`, so the bench
# can measure whether the judge scores a Vietnamese answer differently from its English twin.
#
# `labels` are per-dimension human scores (1–5) on the active rubric dimensions; `expected_min/max`
# is the weighted_score band the judge must land in (the regression gate). `anchors` are BARS-style
# per-band exemplars that keep labels consistent across labelers.
#
# HITL: answers, labels, bands, and anchors are an AI-authored DRAFT and need human review before this
# bench is trusted to gate judge changes.
#
# Mixed-mode cases (issue 0024, ADR 0007) carry `language: mixed` and `language_mode: mixed` — the
# judge is told the Session code-switches. Their `expected_min/max` band still gates the TECHNICAL
# weighted_score only; english_delivery (active on English-dominant answers via rubric weight) is
# labelled and reported separately, never banded. `language` is the answer's language; `language_mode`
# is the Session mode the judge is told (en for every legacy case, keeping those prompts stable).

anchors:
  system_thinking:
    "2": >-
      Mentions a fix in isolation ("add more data", "use dropout") without connecting it to a
      diagnosis, trade-off, or downstream effect.
    "3": >-
      The fix is tied to ONE link of the chain — either why it is needed or what it affects — but
      the interaction is asserted rather than traced (e.g. "remove the rate limiter so the queue
      drains faster", with nothing about what that does to the failing service). Monitoring or
      alerting added alongside a fix is not reasoning about that fix's effect on the system and does
      not by itself lift a 2 to a 3. An asserted chain is a 3 however fluently or confidently it is
      phrased, in any language.
    "4": >-
      Reasons about the interaction: names a diagnosis, the trade-off it drives, and the consequence
      of the chosen fix on other parts of the system (e.g. "regularise, but that raises bias, so I
      cross-validate the strength").
  correctness:
    "2": >-
      Contains a real technical error or a vague statement that is only half-right (e.g. "L2 makes
      weights smaller which is always better").
    "3": >-
      Nothing wrong, but the claim is left as a bare assertion: the right technique or term is named
      and the justification is an unsupported "so it is better" / "it helps", with no mechanism given
      (e.g. "Dropout turns off some neurons so it is better"). A bare assertion cannot reach 4
      however fluently or confidently it is phrased, in any language.
    "4": >-
      Technically accurate with the key mechanism stated correctly, even if not exhaustive (e.g. "L2
      penalises squared weights, trading a little fit for lower variance").
  depth:
    "2": >-
      Names the relevant concepts but no mechanism — keyword-level recall ("use regularization,
      cross-validation") without saying how or why they work.
      The 1/2 boundary: a 2 must introduce at least one idea the question did not already supply.
      Answering "why is word segmentation important?" with "you need to split the words so the model
      understands" echoes the question's own vocabulary and names nothing — a 1, and a 1 in
      Vietnamese too, where the judge's draws on that exact answer spanned 2.00–3.00 while its
      English twin sat at 2.00 on every draw (GH #96).
    "3": >-
      States a mechanism but stops there: nothing about what it costs, when it fails, or what it
      trades away (e.g. "dropout randomly zeroes activations during training so the network cannot
      rely on any one unit" — how it works, with no price named). A mechanism with no cost attached
      is a 3 however fluently or confidently it is phrased, in any language.
      The 2/3 boundary is HOW, not WHAT: an answer must say how the technique produces the effect in
      question. "Dropout turns off some neurons so it is better" names the operation and asserts the
      benefit with no causal step between them — that is a 2, and it is a 2 in Vietnamese too, where
      the same sentence reads more authoritatively (GH #92/#96, the measured failure mode).
      This test decides 2 vs 3 and nothing above it: an answer that names a mechanism AND a
      trade-off is a 4 even when compressed. Stating it unscoped measurably dragged strong answers
      from 4 to 3 (depth bias +0.03 → −0.11, three strong cases straddling the 3.8 floor).
    "4": >-
      States the mechanism and one real trade-off or failure mode, even briefly (e.g. "L2 shrinks
      weights which lowers variance but raises bias"). Edge-case coverage is a 5, not a bar for 4.
  communication:
    "2": >-
      Rambling or disorganized: the reader must reconstruct the argument's order themselves.
      Fluency does not rescue it — organization is what is scored.
    "3": >-
      Readable sentences but unscoped or meandering, OR a bare claim with nothing after it to
      organize. An answer too short to HAVE a structure cannot score 4 for sounding natural.
    "4": >-
      Ordered and well-scoped (claim, mechanism, example) with no filler. Merely fluent sentences
      without that structure are a 3.
  english_delivery:
    "2": >-
      Frequent broken phrasing that obscures the meaning ("model is overfit when data less"); the
      reader must re-read sentences to extract the idea. Judged on delivery only — the technical
      content may still be strong.
    "4": >-
      Clear professional English with minor slips (an article or tense error) that never obscure
      the technical point.

cases:
  # --- ml_fundamentals: bias/variance, four quality levels ---
  - case_id: ml_bias_variance_weak_en
    paired_id: ml_bias_variance_weak
    skill: ml_fundamentals
    language: en
    question: Explain the bias-variance tradeoff and how it guides regularization.
    answer: >-
      Bias is when the model is wrong and variance is when it changes a lot. You fix it by adding more
      data or using a bigger model.
    rubric: {correctness: 0.4, depth: 0.3, communication: 0.2, system_thinking: 0.1, mlops_awareness: 0.0}
    labels: {correctness: 2, depth: 1, communication: 3, system_thinking: 2}
    expected_min: 1.0
    expected_max: 2.6

  - case_id: ml_bias_variance_weak_vi
    paired_id: ml_bias_variance_weak
    skill: ml_fundamentals
    language: vi
    question: Explain the bias-variance tradeoff and how it guides regularization.
    answer: >-
      Bias là khi mô hình sai, còn variance là khi nó thay đổi nhiều. Cách sửa là thêm dữ liệu hoặc
      dùng mô hình lớn hơn.
    rubric: {correctness: 0.4, depth: 0.3, communication: 0.2, system_thinking: 0.1, mlops_awareness: 0.0}
    labels: {correctness: 2, depth: 1, communication: 3, system_thinking: 2}
    expected_min: 1.0
    expected_max: 2.6

  - case_id: ml_bias_variance_strong_en
    paired_id: ml_bias_variance_strong
    skill: ml_fundamentals
    language: en
    question: Explain the bias-variance tradeoff and how it guides regularization.
    answer: >-
      High bias underfits — train and validation error are both high and close; high variance overfits
      — low train error with a wide validation gap. Regularization trades a little fit for lower
      variance: L2 shrinks weights, and I pick its strength by cross-validation where validation error
      bottoms out before the gap widens.
    rubric: {correctness: 0.4, depth: 0.3, communication: 0.2, system_thinking: 0.1, mlops_awareness: 0.0}
    labels: {correctness: 5, depth: 4, communication: 4, system_thinking: 4}
    expected_min: 3.8
    expected_max: 5.0

  - case_id: ml_bias_variance_strong_vi
    paired_id: ml_bias_variance_strong
    skill: ml_fundamentals
    language: vi
    question: Explain the bias-variance tradeoff and how it guides regularization.
    answer: >-
      Bias cao thì underfit — lỗi train và validation đều cao và gần nhau; variance cao thì overfit —
      lỗi train thấp nhưng khoảng cách tới validation rộng. Regularization đánh đổi một chút độ khớp để
      giảm variance: L2 co nhỏ trọng số, và tôi chọn cường độ bằng cross-validation tại điểm lỗi
      validation thấp nhất trước khi khoảng cách nới rộng.
    rubric: {correctness: 0.4, depth: 0.3, communication: 0.2, system_thinking: 0.1, mlops_awareness: 0.0}
    labels: {correctness: 5, depth: 4, communication: 4, system_thinking: 4}
    expected_min: 3.8
    expected_max: 5.0

  - case_id: ml_regularization_medium_en
    paired_id: ml_regularization_medium
    skill: ml_fundamentals
    language: en
    question: Why does L2 regularization reduce overfitting and how do you choose its strength?
    answer: >-
      L2 adds a penalty on the squared weights so the model keeps them smaller, which makes it simpler
      and overfit less. I would try a few values and keep the one with the best validation score.
    rubric: {correctness: 0.4, depth: 0.3, communication: 0.2, system_thinking: 0.1, mlops_awareness: 0.0}
